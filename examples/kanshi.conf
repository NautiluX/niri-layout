# Fictional monitor descriptions and illustrative dimensions; replace them.
# Start niri-layout daemon before Kanshi (scripts/start-session handles this).
profile presentation {
    output eDP-1 enable scale 1 position 0,0
    output "Example Displays Projector DEMO-002" enable scale 1 position 1920,0
    exec niri-layout apply presenting --output laptop=eDP-1 --output 'external=Example Displays Projector DEMO-002'
}
profile dock {
    output eDP-1 enable scale 1 position 0,0
    output "Example Displays DeskPanel DEMO-001" enable scale 1 position 1920,0
    exec niri-layout apply docked --output laptop=eDP-1 --output 'external=Example Displays DeskPanel DEMO-001'
}
profile portable {
    output eDP-1 enable scale 1 position 0,0
    exec niri-layout apply portable --output laptop=eDP-1
}
# Requires at least one additional output. Specific profiles go above fallbacks.
profile unknown-dock {
    output eDP-1 enable scale 1 position 0,0
    output "*" enable
    ...output "* * *" enable
    exec niri-layout apply docked --output laptop=eDP-1 --output external=first-external
}
profile external-only {
    output "*" enable
    ...output "* * *" enable
    exec niri-layout apply external-only --output laptop=first-external
}
